  // ---------- Export PNG ----------
  // Renders by measuring the live DOM, so the export matches exactly what's
  // on screen (including how images wrap). No external libraries needed.
  function exportPNG(){
    if(state.mode==="budget"){ exportBudgetPNG(); return; }
    if(state.mode!=="tier"){
      flash("PNG export is available in Tier and Budget modes — use screen recording for the others.");
      return;
    }
    const tierEls = [...board.querySelectorAll(".tier")];
    if(!tierEls.length){ flash("Nothing to export."); return; }

    const firstLabel = tierEls[0].querySelector(".tier-label").getBoundingClientRect();
    const firstRow   = tierEls[0].querySelector(".tier-row").getBoundingClientRect();
    const originX = firstLabel.left;
    const originY = tierEls[0].getBoundingClientRect().top;
    const width   = firstRow.right - originX;
    const lastRect = tierEls[tierEls.length-1].getBoundingClientRect();
    const height  = lastRect.bottom - originY;

    const scale = 2; // retina-quality output
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(width*scale);
    canvas.height = Math.round(height*scale);
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);

    ctx.fillStyle = "#202020";
    ctx.fillRect(0,0,width,height);

    tierEls.forEach((tierEl, i)=>{
      const tier = state.tiers[i];
      const tr = tierEl.getBoundingClientRect();
      const lr = tierEl.querySelector(".tier-label").getBoundingClientRect();
      const rr = tierEl.querySelector(".tier-row").getBoundingClientRect();
      const y = tr.top - originY;

      // label block
      ctx.fillStyle = tier.color;
      ctx.fillRect(lr.left-originX, y, lr.width, tr.height);

      // label text (supports multiple lines)
      ctx.fillStyle = "#111";
      ctx.font = '700 20px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const lines = String(tier.name||"").split("\n");
      const lh = 23;
      const startY = y + tr.height/2 - ((lines.length-1)*lh)/2;
      lines.forEach((ln,k)=>{
        ctx.fillText(ln, lr.left-originX + lr.width/2, startY + k*lh, lr.width-12);
      });

      // row background
      ctx.fillStyle = "#202020";
      ctx.fillRect(rr.left-originX, y, rr.width, tr.height);

      // items
      tierEl.querySelectorAll(".tier-row .item").forEach(itemEl=>{
        const ir = itemEl.getBoundingClientRect();
        const dx = ir.left-originX, dy = ir.top-originY, dw = ir.width, dh = ir.height;
        const img = itemEl.querySelector("img");

        ctx.fillStyle = "#111";
        ctx.fillRect(dx,dy,dw,dh);

        if(img && img.complete && img.naturalWidth){
          // replicate CSS object-fit: cover
          const s = Math.max(dw/img.naturalWidth, dh/img.naturalHeight);
          const sw = dw/s, sh = dh/s;
          const sx = (img.naturalWidth - sw)/2, sy = (img.naturalHeight - sh)/2;
          ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
        }

        // caption bar, if the thumbnail shows one
        const cap = itemEl.querySelector(".cap");
        if(cap){
          const ch = Math.min(14, dh*0.22);
          ctx.fillStyle = "rgba(0,0,0,.6)";
          ctx.fillRect(dx, dy+dh-ch, dw, ch);
          ctx.fillStyle = "#fff";
          ctx.font = '10px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(cap.textContent, dx+dw/2, dy+dh-ch/2, dw-4);
        }
      });

      // row separator
      ctx.strokeStyle = "#3a3a3a";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, y+tr.height-0.5);
      ctx.lineTo(width, y+tr.height-0.5);
      ctx.stroke();
    });

    canvas.toBlob(blob=>{
      if(!blob){ flash("Export failed."); return; }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (state.title||"tierlist").replace(/[^\w\-]+/g,"_") + ".png";
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
      flash("PNG exported.");
    }, "image/png");
  }

  // Receipt-style PNG for budget mode.
  function exportBudgetPNG(){
    const items = state.purchased.map(id=>state.images[id]).filter(Boolean);
    const W = 640, pad = 32, rowH = 54, thumb = 40;
    const bodyRows = Math.max(1, items.length);
    const H = pad + 40 + 14 + (bodyRows*rowH) + 22 + 32 + 40 + pad;
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = W*scale; canvas.height = Math.round(H)*scale;
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(0,0,W,H);

    const MONO = 'ui-monospace, Menlo, Consolas, monospace';
    let y = pad;

    // title (doubles as the receipt header)
    ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.font = '700 28px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
    ctx.fillText((state.title && state.title!=="Untitled Tier List") ? state.title : "Budget", pad, y);
    y += 40;

    ctx.strokeStyle = "#3a3a3a"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-pad,y); ctx.stroke(); y += 14;

    // items
    ctx.font = '500 15px '+MONO;
    if(items.length === 0){
      ctx.fillStyle = "#9a9a9a"; ctx.textBaseline = "middle";
      ctx.fillText("No items purchased yet", pad, y+rowH/2);
      ctx.textBaseline = "top"; y += rowH;
    } else {
      items.forEach(im=>{
        const imgEl = document.querySelector('#buyArea .item[data-item-id="'+im.id+'"] img');
        roundRect(ctx, pad, y, thumb, thumb, 5);
        if(imgEl && imgEl.complete && imgEl.naturalWidth){
          ctx.save(); ctx.clip();
          const s = Math.max(thumb/imgEl.naturalWidth, thumb/imgEl.naturalHeight);
          const sw = thumb/s, sh = thumb/s;
          ctx.drawImage(imgEl, (imgEl.naturalWidth-sw)/2, (imgEl.naturalHeight-sh)/2, sw, sh, pad, y, thumb, thumb);
          ctx.restore();
        } else { ctx.fillStyle = "#111"; ctx.fill(); }
        ctx.fillStyle = "#e8e8e8"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
        ctx.fillText(im.name || "Item", pad+thumb+14, y+thumb/2, W-2*pad-thumb-100);
        ctx.textAlign = "right"; ctx.fillStyle = "#fff";
        ctx.fillText(im.price==null ? "—" : "-"+fmtMoney(im.price), W-pad, y+thumb/2);
        ctx.textAlign = "left"; ctx.textBaseline = "top";
        y += rowH;
      });
    }
    y += 6;
    ctx.strokeStyle = "#3a3a3a";
    ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-pad,y); ctx.stroke(); y += 16;

    // Budget then Remaining (remaining = budget − items).
    const remaining = state.budget - budgetSpent();
    ctx.font = '700 18px '+MONO; ctx.fillStyle = "#e8e8e8"; ctx.textAlign = "left";
    ctx.fillText("Budget", pad, y);
    ctx.textAlign = "right"; ctx.fillText(fmtMoney(state.budget), W-pad, y);
    y += 32;
    ctx.textAlign = "left"; ctx.font = '800 24px '+MONO;
    ctx.fillStyle = remaining < 0 ? "#ff6b6b" : "#7fff7f";
    ctx.fillText("Remaining", pad, y);
    ctx.textAlign = "right"; ctx.fillText(fmtMoney(remaining), W-pad, y);

    canvas.toBlob(blob=>{
      if(!blob){ flash("Export failed."); return; }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (state.title||"budget").replace(/[^\w\-]+/g,"_") + "_receipt.png";
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
      flash("Receipt exported.");
    }, "image/png");
  }
  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  // ---------- Templates ----------
  function getCustomTemplates(){
    try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
    catch(e){ return []; }
  }
  function setCustomTemplates(list){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(list)); }
    catch(e){ alert("Couldn't save template (browser storage unavailable)."); }
  }
  function rebuildTemplateSelect(){
    const sel = document.getElementById("templateSelect");
    sel.innerHTML = '<option value="" disabled selected>Templates</option>';

    const og1 = document.createElement("optgroup");
    og1.label = "Presets";
    PRESET_TEMPLATES.forEach((t,i)=>{
      const o=document.createElement("option"); o.value="p:"+i; o.textContent=t.name; og1.appendChild(o);
    });
    sel.appendChild(og1);

    const custom = getCustomTemplates();
    const og2 = document.createElement("optgroup");
    og2.label = "My Templates";
    if(custom.length===0){
      const o=document.createElement("option"); o.value=""; o.disabled=true; o.textContent="(none saved yet)"; og2.appendChild(o);
    } else {
      custom.forEach((t,i)=>{
        const o=document.createElement("option"); o.value="c:"+i; o.textContent=t.name; og2.appendChild(o);
      });
    }
    sel.appendChild(og2);

    const og3 = document.createElement("optgroup");
    og3.label = "Manage";
    const del=document.createElement("option"); del.value="__delete"; del.textContent="Delete a saved template…"; og3.appendChild(del);
    sel.appendChild(og3);
  }
  function applyTemplate(tpl){
    // Keep all images: move any placed items back to the pool, then rebuild tiers.
    state.tiers.forEach(t=>{ if(t.items.length) state.pool.push(...t.items); });
    state.tiers = tpl.tiers.map(t=>({id:nid(), name:t.name, color:t.color, items:[]}));
    renderBoard();
    renderPool();
  }
  function onTemplateSelect(){
    const sel = document.getElementById("templateSelect");
    const v = sel.value;
    sel.value = ""; // reset back to label
    if(!v) return;
    if(v==="__delete"){ deleteTemplateFlow(); return; }
    if(v.startsWith("p:")) applyTemplate(PRESET_TEMPLATES[+v.slice(2)]);
    else if(v.startsWith("c:")) applyTemplate(getCustomTemplates()[+v.slice(2)]);
  }
  function saveCurrentAsTemplate(){
    const suggested = (state.title && state.title!=="Untitled Tier List") ? state.title : "";
    const name = prompt("Template name (rows + colours only, no images):", suggested);
    if(name===null) return;
    const trimmed = name.trim();
    if(!trimmed){ alert("Please enter a name."); return; }
    const list = getCustomTemplates();
    const tpl = {name:trimmed, tiers: state.tiers.map(t=>({name:t.name, color:t.color}))};
    const existing = list.findIndex(t=>t.name.toLowerCase()===trimmed.toLowerCase());
    if(existing>=0){
      if(!confirm('A template named "'+trimmed+'" exists. Overwrite it?')) return;
      list[existing]=tpl;
    } else list.push(tpl);
    setCustomTemplates(list);
    rebuildTemplateSelect();
    flash('Template "'+trimmed+'" saved.');
  }
  function deleteTemplateFlow(){
    const list = getCustomTemplates();
    if(list.length===0){ alert("You have no saved templates to delete."); return; }
    const names = list.map((t,i)=>(i+1)+". "+t.name).join("\n");
    const pick = prompt("Delete which template? Enter its number:\n\n"+names);
    if(pick===null) return;
    const idx = parseInt(pick,10)-1;
    if(isNaN(idx)||idx<0||idx>=list.length){ alert("Invalid number."); return; }
    const removed = list.splice(idx,1)[0];
    setCustomTemplates(list);
    rebuildTemplateSelect();
    flash('Deleted "'+removed.name+'".');
  }
  function flash(msg){
    let el = document.getElementById("__flash");
    if(!el){
      el=document.createElement("div"); el.id="__flash";
      el.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;";
      document.body.appendChild(el);
    }
    el.textContent=msg; el.style.opacity="1";
    clearTimeout(el.__t); el.__t=setTimeout(()=>{el.style.opacity="0";},1800);
  }

  // ---------- Save to GitHub + Setups menu ----------
  const GH_OWNER = "hpa-sam", GH_REPO = "tiermaker", GH_BRANCH = "main";
  const GH_TOKEN_KEY = "tiermaker_gh_token";
  let _setupsCache = null;

  function ghUrl(path){ return "https://api.github.com/repos/"+GH_OWNER+"/"+GH_REPO+"/contents/"+path; }
  function ghHeaders(token){ return {"Authorization":"Bearer "+token, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"}; }
  function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64decode(str){ return decodeURIComponent(escape(atob(str.replace(/\s/g,"")))); }
  function shareLink(slug){ return location.origin + location.pathname + "?project=" + encodeURIComponent(slug); }
  function slugify(s){ return (s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "setup"; }

  function ensureToken(){
    let t = localStorage.getItem(GH_TOKEN_KEY);
    if(!t){
      t = prompt("Paste a GitHub fine-grained personal access token with Contents: Read & Write on "
                 + GH_OWNER + "/" + GH_REPO + ".\n\nIt is stored only in this browser and never uploaded or committed.");
      if(t){ t = t.trim(); localStorage.setItem(GH_TOKEN_KEY, t); }
    }
    return t;
  }
  async function ghGetSha(path, token){
    const r = await fetch(ghUrl(path) + "?ref=" + GH_BRANCH, {headers: ghHeaders(token)});
    if(r.status === 404) return null;
    if(!r.ok) throw new Error("HTTP " + r.status);
    return (await r.json()).sha;
  }
  async function ghPut(path, contentStr, message, token, sha){
    const body = {message, content: b64encode(contentStr), branch: GH_BRANCH};
    if(sha) body.sha = sha;
    const r = await fetch(ghUrl(path), {method:"PUT", headers: ghHeaders(token), body: JSON.stringify(body)});
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }
  async function updateManifest(entry, token){
    const path = "projects/index.json";
    let list = [], sha = null;
    try{
      const r = await fetch(ghUrl(path) + "?ref=" + GH_BRANCH, {headers: ghHeaders(token)});
      if(r.ok){ const j = await r.json(); sha = j.sha; list = (JSON.parse(b64decode(j.content)).setups) || []; }
    }catch(e){ /* first save: no manifest yet */ }
    list = list.filter(s=>s.file !== entry.file);
    list.unshift(entry);
    await ghPut(path, JSON.stringify({setups:list}, null, 2), "Update setups index", token, sha);
    _setupsCache = list;
  }
  async function ghSaveSetup(){
    state.title = titleInput.value;
    const name = prompt("Name this setup (shows in the Setups menu):", titleOr("Setup"));
    if(name === null) return;
    const disp = name.trim() || "Untitled setup";
    const slug = slugify(disp);
    const token = ensureToken();
    if(!token) return;
    flash("Saving to GitHub…");
    try{
      const sha = await ghGetSha("projects/" + slug + ".json", token);
      await ghPut("projects/" + slug + ".json", JSON.stringify(state), "Save setup: " + disp, token, sha);
      await updateManifest({file:slug, name:disp, mode:state.mode, savedAt:new Date().toISOString()}, token);
      const link = shareLink(slug);
      try{ await navigator.clipboard.writeText(link); flash("Saved ✓ — link copied to clipboard"); }
      catch(e){ flash("Saved ✓ — " + link); }
    }catch(e){
      if(/\b(401|403)\b/.test(e.message)){
        localStorage.removeItem(GH_TOKEN_KEY);
        alert("GitHub rejected the token. It has been cleared — try again with a fine-grained token that has Contents: Read & Write on " + GH_OWNER + "/" + GH_REPO + ".");
      } else {
        alert("Save failed: " + e.message);
      }
    }
  }

  function openSetups(){
    document.getElementById("setupsOverlay").classList.add("show");
    const listEl = document.getElementById("setupsList");
    listEl.innerHTML = "<div class='tt-msg'>Loading…</div>";
    fetch("projects/index.json?_=" + Date.now())
      .then(r=> r.ok ? r.json() : (r.status===404 ? {setups:[]} : Promise.reject(new Error("HTTP "+r.status))))
      .then(j=>{ _setupsCache = j.setups || []; renderSetups(_setupsCache); })
      .catch(()=> renderSetups(_setupsCache || []));
  }
  function renderSetups(list){
    const el = document.getElementById("setupsList");
    el.innerHTML = "";
    if(!list || !list.length){
      el.innerHTML = "<div class='tt-msg'>No saved setups yet. Build one and click “Save to GitHub”.</div>";
      return;
    }
    list.forEach(s=>{
      const card = document.createElement("div"); card.className = "setup-card";
      const info = document.createElement("div"); info.className = "setup-info";
      const nm = document.createElement("div"); nm.className = "setup-name"; nm.textContent = s.name || s.file;
      const md = document.createElement("div"); md.className = "setup-mode"; md.textContent = (s.mode || "tier").replace("thisthat","This / That");
      info.append(nm, md);
      const acts = document.createElement("div"); acts.className = "setup-acts";
      const open = document.createElement("button"); open.className = "tb"; open.textContent = "Open";
      open.addEventListener("click", ()=>{ location.href = shareLink(s.file); });
      const rec = document.createElement("button"); rec.className = "tb"; rec.textContent = "Open + Record";
      rec.addEventListener("click", ()=>{ location.href = shareLink(s.file) + "&record=1"; });
      const cp = document.createElement("button"); cp.className = "tb"; cp.textContent = "Copy link";
      cp.addEventListener("click", ()=>{ (navigator.clipboard ? navigator.clipboard.writeText(shareLink(s.file)) : 0); flash("Link copied."); });
      acts.append(open, rec, cp);
      card.append(info, acts);
      el.appendChild(card);
    });
  }
  function closeSetups(){ document.getElementById("setupsOverlay").classList.remove("show"); }

  // ---------- Recording mode ----------
  function toggleRecording(){
    document.body.classList.toggle("recording");
    const on = document.body.classList.contains("recording");
    document.getElementById("recordBtn").classList.toggle("active", on);
  }

  // ---------- Wire up ----------
  titleInput.addEventListener("input", ()=>{
    state.title = titleInput.value; syncDocTitle();
    // every mode's panel header mirrors the title
    document.getElementById("receiptHead").textContent = titleOr("Budget");
    document.getElementById("bracketHead").textContent = titleOr("Bracket");
    document.getElementById("draftMainHead").textContent = titleOr("Draft");
    document.getElementById("ttHead").textContent = titleOr("This / That");
  });
  document.querySelectorAll(".modeTab").forEach(b=>b.addEventListener("click", ()=>setMode(b.dataset.mode)));
  document.getElementById("budgetInput").addEventListener("input", (e)=>{
    const v = parseFloat(e.target.value);
    state.budget = isNaN(v) ? 0 : Math.max(0, Math.round(v));
    renderReceipt();
  });
  document.getElementById("draftBudgetToggle").addEventListener("change", (e)=>{
    state.draft.budgetOn = e.target.checked;
    render(); // updates body.draft-cap so price badges show/hide
  });
  document.getElementById("draftBudgetInput").addEventListener("input", (e)=>{
    const v = parseFloat(e.target.value);
    state.budget = isNaN(v) ? 0 : Math.max(0, Math.round(v));
    renderDraft();
  });
  document.getElementById("bracketGenerate").addEventListener("click", generateBracketFromPool);
  document.getElementById("bracketRestart").addEventListener("click", bracketRestart);
  document.getElementById("ttReset").addEventListener("click", ttReset);
  document.getElementById("winnerClose").addEventListener("click", hideWinner);
  document.getElementById("addTierBtn").addEventListener("click", ()=>addTier());
  document.getElementById("uploadBtn").addEventListener("click", ()=>fileInput.click());
  document.getElementById("uploadBtn2").addEventListener("click", ()=>fileInput.click());
  fileInput.addEventListener("change", ()=>{ addImages(fileInput.files); fileInput.value=""; });
  document.getElementById("clearPoolBtn").addEventListener("click", ()=>{
    if(state.pool.length && confirm("Remove all images from the pool? (Images already placed stay.)")){
      state.pool.forEach(id=>{ delete state.images[id]; purgeImageRefs(id); });
      state.pool = [];
      if(selectedItemId && !state.images[selectedItemId]) selectedItemId = null;
      refresh();
      renderPreview();
    }
  });
  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(confirm("Reset everything? This clears all tiers and images.")){
      state = {title:"Untitled Tier List", tiers:[], pool:[], images:{}};
      init();
    }
  });
  document.getElementById("previewClear").addEventListener("click", clearSelection);
  document.getElementById("previewToggle").addEventListener("click", ()=>{
    const off = document.body.classList.toggle("no-preview");
    document.getElementById("previewToggle").classList.toggle("active", !off);
  });
  document.getElementById("exportBtn").addEventListener("click", exportPNG);
  document.getElementById("saveBtn").addEventListener("click", save);
  document.getElementById("loadBtn").addEventListener("click", ()=>loadFileInput.click());
  loadFileInput.addEventListener("change", ()=>{
    const f = loadFileInput.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ try{ loadFromObj(JSON.parse(r.result)); }catch(err){ alert("Could not load file: "+err.message); } };
    r.readAsText(f);
    loadFileInput.value="";
  });
  document.getElementById("ghSaveBtn").addEventListener("click", ghSaveSetup);
  document.getElementById("setupsBtn").addEventListener("click", openSetups);
  document.getElementById("setupsClose").addEventListener("click", closeSetups);
  document.getElementById("setupsOverlay").addEventListener("click", (e)=>{ if(e.target.id==="setupsOverlay") closeSetups(); });
  document.getElementById("recordBtn").addEventListener("click", toggleRecording);
  document.getElementById("recExit").addEventListener("click", toggleRecording);
  document.getElementById("templateSelect").addEventListener("change", onTemplateSelect);
  document.getElementById("saveTemplateBtn").addEventListener("click", saveCurrentAsTemplate);
  document.getElementById("thumbSize").addEventListener("input", (e)=>{
    document.documentElement.style.setProperty("--thumb", e.target.value+"px");
  });

  // Allow dropping image files anywhere onto the pool from OS
  ["dragover","drop"].forEach(ev=>{
    document.addEventListener(ev,(e)=>{
      if(e.dataTransfer && [...e.dataTransfer.types].includes("Files")){
        e.preventDefault();
        if(ev==="drop") addImages(e.dataTransfer.files);
      }
    });
  });

  window.addEventListener("resize", updateHeaderOffset);

  init();
  loadProjectFromURL();
})();
</script>
