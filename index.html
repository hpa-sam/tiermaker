<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tier Maker</title>
<meta name="description" content="Build tier list ranking boards for video. No ads, no bloat.">
<meta name="theme-color" content="#1a1a1a">

     NOTE: swap the two URLs below for your absolute GitHub Pages URL once live,
     e.g. https://your-org.github.io/tiermaker/ — some crawlers ignore relative paths. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Tier Maker">
<meta property="og:description" content="Build tier list ranking boards for video. No ads, no bloat.">
<meta property="og:image" content="preview.png">
<meta property="og:url" content="./">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tier Maker">
<meta name="twitter:description" content="Build tier list ranking boards for video. No ads, no bloat.">
<meta name="twitter:image" content="preview.png">
<style>
  :root{
    --bg:#1a1a1a;
    --panel:#242424;
    --panel-2:#2b2b2b;
    --line:#3a3a3a;
    --text:#e8e8e8;
    --muted:#9a9a9a;
    --accent:#4a9eff;
    --label-w:150px;
    --row-min:96px;
    --thumb:88px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Header (mode tabs + toolbar) ---------- */
  #appHeader{position:sticky;top:0;z-index:50;}
  #modeBar{
    display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;
    background:#141414;
    border-bottom:1px solid var(--line);
    padding:0 12px;
  }
  #modeBar .spacer{flex:1;}
  .navActions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;}
  #toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:12px 16px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  #toolbar h1{
    font-size:16px;font-weight:600;margin:0 12px 0 0;letter-spacing:.3px;
  }
  #titleInput{
    background:transparent;border:none;color:var(--text);
    font-size:16px;font-weight:600;padding:4px 6px;border-radius:6px;min-width:180px;
  }
  #titleInput:hover{background:var(--panel-2);}
  #titleInput:focus{outline:1px solid var(--accent);background:var(--panel-2);}
  .spacer{flex:1;}
  button.tb{
    background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13px;
    display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s;
  }
  button.tb:hover{background:#333;border-color:#555;}
  button.tb.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.tb.primary:hover{background:#3b8bec;}
  button.tb.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* ---------- Stage: tier list + preview panel ---------- */
  #stage{
    display:flex;gap:16px;align-items:flex-start;
    max-width:1600px;margin:0 auto;padding:16px;
  }
  /* Columns. Board and buy-area grow; info and preview are fixed sidebars. */
  #col-board{flex:1;min-width:0;}
  #col-buy{flex:1;min-width:0;}
  #col-budgetInfo{flex:0 0 340px;width:340px;position:sticky;top:var(--sticky-top,96px);}
  #rightCol{flex:0 0 340px;width:340px;position:sticky;top:var(--sticky-top,96px);}
  /* Which columns show in which mode */
  #col-budgetInfo,#col-buy{display:none;}
  body.mode-budget #col-board{display:none;}
  body.mode-budget #col-budgetInfo{display:flex;flex-direction:column;}
  body.mode-budget #col-buy{display:flex;flex-direction:column;}
  /* Budget mode: balance all three columns to equal (tallest) height */
  body.mode-budget #stage{align-items:stretch;}
  #previewPanel{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  }
  #previewHead{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;border-bottom:1px solid var(--line);
    font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;
  }
  #previewClear{
    background:transparent;border:none;color:var(--muted);cursor:pointer;
    font-size:13px;padding:2px 6px;border-radius:4px;
  }
  #previewClear:hover{background:#333;color:#fff;}
  #previewBox{
    height:320px;display:flex;align-items:center;justify-content:center;
    background:#151515;padding:10px;
  }
  #previewBox img{max-width:100%;max-height:100%;object-fit:contain;display:none;border-radius:4px;}
  #previewBox img.shown{display:block;}
  #previewEmpty{color:var(--muted);font-size:13px;text-align:center;padding:0 20px;}
  #previewName{
    padding:10px 12px;font-size:14px;font-weight:600;text-align:center;
    color:var(--text);min-height:38px;word-break:break-word;
  }
  /* Toggle the panel off for a full-width board */
  body.no-preview #previewPanel{display:none;}

  @media (max-width:1100px){
    #stage{flex-direction:column;}
    #rightCol,#col-budgetInfo{width:100%;flex:1 1 auto;position:static;}
  }

  /* ---------- Tier list ---------- */
  #board{}
  .tier{
    display:flex;align-items:stretch;
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom:none;
    min-height:var(--row-min);
  }
  .tier:first-child{border-top-left-radius:8px;border-top-right-radius:8px;}
  .tier:last-child{border-bottom:1px solid var(--line);border-bottom-left-radius:8px;border-bottom-right-radius:8px;}

  .tier-label{
    width:var(--label-w);min-width:var(--label-w);
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:8px;position:relative;
    color:#111;font-weight:700;
  }
  .tier-label textarea{
    background:transparent;border:none;resize:none;text-align:center;
    color:inherit;font-weight:700;font-size:20px;font-family:inherit;
    width:100%;overflow:hidden;line-height:1.15;padding:0;
  }
  .tier-label textarea:focus{outline:none;}

  .tier-row{
    flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;
    gap:2px;padding:3px;min-height:var(--row-min);
    background:#202020;
  }
  .tier-row.dragover{background:#2d3a4d;outline:2px dashed var(--accent);outline-offset:-2px;}

  .tier-controls{
    width:74px;min-width:74px;
    background:#141414;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    padding:6px;
  }
  .tier-controls .ctrl-row{display:flex;gap:6px;}
  .tier-controls button{
    background:transparent;border:none;color:#cfcfcf;cursor:pointer;
    width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;
    font-size:15px;line-height:1;
  }
  .tier-controls button:hover{background:#2c2c2c;color:#fff;}
  .tier-controls input[type=color]{
    -webkit-appearance:none;appearance:none;border:none;background:none;
    width:26px;height:26px;padding:0;cursor:pointer;border-radius:5px;overflow:hidden;
  }
  .tier-controls input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
  .tier-controls input[type=color]::-webkit-color-swatch{border:1px solid #555;border-radius:5px;}

  /* ---------- Add tier ---------- */
  #addTierWrap{margin:10px 0 0;}
  #addTierBtn{
    width:100%;background:var(--panel);border:1px dashed var(--line);color:var(--muted);
    padding:10px;border-radius:8px;cursor:pointer;font-size:14px;
  }
  #addTierBtn:hover{background:var(--panel-2);color:var(--text);border-color:#555;}

  /* ---------- Image pool ---------- */
  #poolSection{max-width:1600px;margin:22px auto 60px;padding:0 16px;}
  #poolHeader{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
  #poolHeader h2{font-size:14px;font-weight:600;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  #pool{
    display:flex;flex-wrap:wrap;gap:4px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:8px;min-height:120px;align-content:flex-start;
  }
  #pool.dragover{background:#2d3a4d;outline:2px dashed var(--accent);outline-offset:-2px;}
  #poolEmpty{color:var(--muted);font-size:13px;padding:24px;width:100%;text-align:center;}

  /* ---------- Items ---------- */
  .item{
    width:var(--thumb);height:var(--thumb);
    background:#111;border-radius:4px;overflow:hidden;
    cursor:grab;position:relative;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    user-select:none;
  }
  .item img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .item .cap{
    position:absolute;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.6);color:#fff;font-size:10px;
    padding:2px 3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .item.dragging{opacity:.4;}
  .item.selected{
    outline:3px solid var(--accent);outline-offset:-3px;
    box-shadow:0 0 0 2px rgba(74,158,255,.35);
  }
  .item .del{
    position:absolute;top:1px;right:1px;width:16px;height:16px;border-radius:50%;
    background:rgba(0,0,0,.65);color:#fff;font-size:11px;line-height:16px;text-align:center;
    cursor:pointer;display:none;
  }
  .item:hover .del{display:block;}
  .item.placeholder-drop{outline:2px solid var(--accent);}

  /* Recording mode: hide all editing chrome */
  body.recording #appHeader,
  body.recording .tier-controls,
  body.recording #addTierWrap{display:none;}
  body.recording .item .del{display:none !important;}
  body.recording .tier-label textarea{pointer-events:none;}
  body.recording #previewClear{display:none;}
  /* hide the pool's title, hint text and Add/Clear buttons */
  body.recording #poolHeader{display:none;}
  /* and the "click Add Images" empty-state, which shows once everything is ranked */
  body.recording #poolEmpty{display:none;}
  body.recording #poolSection{margin-top:12px;}
  body.recording.mode-thisthat #poolSection{display:none;} /* keep the next contender a surprise */
  body.recording #rightCol,
  body.recording #col-budgetInfo{top:44px;} /* clears the slim recording bar */
  body.recording #recBar{display:flex;}
  /* Push all content below the slim bar so the bar can be cropped off cleanly */
  body.recording{padding-top:32px;}

  #recBar{
    display:none;position:fixed;top:0;left:0;right:0;height:32px;z-index:200;
    align-items:center;gap:12px;
    padding:0 12px;
    background:#0d0d0d;border-bottom:1px solid #333;
    font-size:12px;color:#8a8a8a;
  }
  #recBarLabel{flex:1;}
  #recExit{
    background:transparent;color:#cfcfcf;border:1px solid #444;
    padding:3px 12px;border-radius:5px;cursor:pointer;font-size:12px;
  }
  #recExit:hover{background:#222;color:#fff;border-color:#666;}

  input[type=file]{display:none;}
  .hint{color:var(--muted);font-size:12px;}
  .tmpl{display:flex;align-items:center;gap:8px;margin-left:6px;}
  #templateSelect{
    background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    padding:7px 10px;border-radius:7px;font-size:13px;cursor:pointer;max-width:220px;
  }
  #templateSelect:hover{border-color:#555;}
  #templateSelect optgroup{color:var(--muted);}
  #templateSelect option{color:var(--text);background:var(--panel-2);}
  .sizeControl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;}
  .sizeControl input{cursor:pointer;}

  /* ---------- Budget input ---------- */
  .budgetSet{display:none;align-items:center;gap:5px;color:var(--muted);font-size:13px;}
  .budgetSet input{
    width:110px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:6px 8px;font-size:14px;font-weight:600;
  }
  body.mode-budget .budgetSet{display:inline-flex;}
  body.mode-budget .tmpl{display:none;} /* templates are tier-only */

  /* ---------- Budget stage ---------- */
  #buyArea{
    flex:1;                 /* fill the middle column's height */
    background:#202020;border:1px solid var(--line);border-radius:10px;
    min-height:190px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;
  }
  #buyArea.dragover{background:#2d3a4d;outline:2px dashed var(--accent);outline-offset:-2px;}
  #buyEmpty{color:var(--muted);font-size:14px;padding:44px 10px;width:100%;text-align:center;}

  /* ---------- Price badge on thumbnails (budget mode + draft w/ cap) ---------- */
  .item .price{display:none;}
  body.mode-budget .item .price,
  body.mode-draft.draft-cap .item .price{
    display:block;position:absolute;top:2px;left:2px;
    background:rgba(0,0,0,.72);color:#7fff7f;font-size:11px;font-weight:700;
    padding:1px 5px;border-radius:4px;cursor:text;max-width:calc(100% - 6px);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  body.mode-budget .item .price.unset,
  body.mode-draft.draft-cap .item .price.unset{color:#ffbf7f;}
  body.recording .item .price{cursor:default;}
  .price-input{
    width:58px;font-size:11px;font-weight:700;border:none;border-radius:3px;
    padding:1px 3px;font-family:inherit;
  }

  /* ---------- Receipt ---------- */
  #receiptPanel{
    flex:1;                 /* fill the left column's height */
    display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  }
  #receiptHead{
    padding:14px 16px;border-bottom:1px solid var(--line);
    font-size:20px;font-weight:700;color:var(--text);word-break:break-word;
  }
  #receiptBody{
    flex:1;display:flex;flex-direction:column;
    padding:14px 16px 16px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  /* Budget + Remaining pinned to the bottom edge of the column */
  .rc-totals{margin-top:auto;}
  .rc-row{display:flex;align-items:baseline;gap:8px;font-size:14px;padding:4px 0;}
  .rc-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;color:var(--text);}
  .rc-dots{flex:1;border-bottom:1px dotted #555;position:relative;top:-4px;}
  .rc-amt{white-space:nowrap;color:var(--text);font-weight:600;}
  .rc-hr{border-top:1px solid var(--line);margin:10px 0;}
  .rc-budget{font-size:19px;}
  .rc-budget .rc-name,.rc-budget .rc-amt{font-weight:700;}
  .rc-remaining{font-size:24px;margin-top:2px;}
  .rc-remaining .rc-name,.rc-remaining .rc-amt{font-weight:800;}
  .rc-remaining .rc-amt{color:#7fff7f;}
  .rc-remaining.neg .rc-amt{color:#ff6b6b;}
  #receiptEmpty{color:var(--muted);font-size:13px;text-align:center;padding:10px 0;}

  /* ================= MULTI-MODE ================= */
  .modeTabs{display:flex;gap:2px;}
  .modeTab{
    background:transparent;color:var(--muted);border:none;border-bottom:3px solid transparent;
    padding:11px 18px;font-size:14px;cursor:pointer;white-space:nowrap;
  }
  .modeTab:hover{color:var(--text);}
  .modeTab.active{color:#fff;border-bottom-color:var(--accent);font-weight:600;}

  .draftSet{display:none;align-items:center;gap:5px;color:var(--muted);font-size:13px;}
  body.mode-draft .draftSet{display:inline-flex;}
  .draftSet input[type=number]{
    width:100px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:6px 8px;font-size:14px;font-weight:600;
  }
  body.mode-draft:not(.draft-cap) #draftCapWrap{display:none;}
  body:not(.mode-tier) .tmpl{display:none;} /* templates are tier-only */

  /* New stage columns */
  #col-draftInfo,#col-ttInfo{flex:0 0 340px;width:340px;position:sticky;top:var(--sticky-top,96px);}
  #col-bracket,#col-draft,#col-tt{flex:1;min-width:0;}
  #col-bracket,#col-bracketPlay,#col-draftInfo,#col-draft,#col-ttInfo,#col-tt{display:none;}
  body.mode-bracket #col-board,body.mode-draft #col-board,body.mode-thisthat #col-board{display:none;}
  body.mode-bracket #rightCol{display:none;}   /* the matchup arena replaces preview */
  body.mode-thisthat #rightCol{display:none;}  /* the VS cards are large enough */
  body.mode-bracket #col-bracket{display:flex;flex-direction:column;flex:1.5;}
  body.mode-bracket #col-bracketPlay{display:flex;flex-direction:column;flex:1;}
  body.mode-draft #col-draft,
  body.mode-thisthat #col-ttInfo,body.mode-thisthat #col-tt{display:flex;flex-direction:column;}
  /* Draft receipt column only appears when the budget cap is on */
  body.mode-draft.draft-cap #col-draftInfo{display:flex;flex-direction:column;}
  body.mode-bracket #stage,body.mode-draft #stage,body.mode-thisthat #stage{align-items:stretch;}
  body.recording #col-draftInfo,body.recording #col-ttInfo,
  body.recording #rightCol{top:44px;}

  /* Shared info panel look (matches the receipt) */
  .infoPanel{
    flex:1;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  }
  .infoHead{
    padding:14px 16px;border-bottom:1px solid var(--line);
    font-size:20px;font-weight:700;color:var(--text);word-break:break-word;
  }
  .infoBody{flex:1;display:flex;flex-direction:column;padding:14px 16px 4px;}

  /* Competitor chips (bracket & draft slots, champion, defeated) */
  .chip{
    display:flex;align-items:center;gap:8px;min-width:0;
    background:#2b2b2b;border:1px solid var(--line);border-radius:6px;
    padding:4px 8px 4px 4px;cursor:grab;user-select:none;max-width:100%;
  }
  .chip img{width:34px;height:34px;object-fit:cover;border-radius:4px;flex:0 0 auto;pointer-events:none;}
  .chip-name{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chip.dragging{opacity:.4;}
  .chip.selected{outline:2px solid var(--accent);outline-offset:-2px;}

  .playArea{
    flex:1;background:#202020;border:1px solid var(--line);border-radius:10px;
    padding:10px;min-height:200px;
  }

  /* ---- Bracket ---- */
  #bracketArea{display:flex;gap:26px;overflow-x:auto;align-items:stretch;}
  .bkt-round{display:flex;flex-direction:column;min-width:184px;}
  .bkt-round-head{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;text-align:center;margin-bottom:8px;}
  .bkt-round-body{flex:1;display:flex;flex-direction:column;}
  .bkt-match-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;}
  .bkt-match{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:5px;}
  .bkt-slot{min-height:44px;border:1px dashed #444;border-radius:6px;display:flex;align-items:center;padding:4px;}
  .bkt-slot.dragover{background:#2d3a4d;border-color:var(--accent);}
  .bkt-slot .placeholder{font-size:12px;color:#666;padding:0 6px;}
  .bkt-slot.bkt-bye{justify-content:space-between;border-style:solid;border-color:#3a3a3a;background:#242424;}
  .bkt-bye-tag{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.5px;padding-right:6px;white-space:nowrap;}
  /* connectors: merge each pair of matches into the single next-round slot */
  .bkt-round:not(:last-child) .bkt-match-wrap:nth-child(odd)::after{
    content:"";position:absolute;right:-13px;top:50%;width:13px;height:50%;
    border-right:2px solid #4a4a4a;border-top:2px solid #4a4a4a;
  }
  .bkt-round:not(:last-child) .bkt-match-wrap:nth-child(even)::after{
    content:"";position:absolute;right:-13px;bottom:50%;width:13px;height:50%;
    border-right:2px solid #4a4a4a;border-bottom:2px solid #4a4a4a;
  }
  .bkt-round:not(:first-child) .bkt-match-wrap::before{
    content:"";position:absolute;left:-13px;top:50%;width:13px;height:2px;background:#4a4a4a;
  }
  #bracketEmpty{color:var(--muted);font-size:14px;text-align:center;padding:60px 10px;margin:auto;}
  .btnWide{
    margin:12px 16px 16px;padding:9px;border-radius:8px;cursor:pointer;font-size:13px;
    background:var(--accent);color:#fff;border:none;font-weight:600;
  }
  .btnWide.secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--line);font-weight:500;}
  .btnWide:hover{filter:brightness(1.08);}

  /* Bracket chart header + arena (click-to-advance) */
  .infoHead.bkt-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  #bracketHead{font-size:20px;font-weight:700;color:var(--text);}
  #bracketChampBadge{font-size:13px;font-weight:700;color:#ffd740;}
  .bkt-head .spacer{flex:1;}
  .bkt-head .tb{font-size:12px;padding:6px 10px;}
  #bracketArea{flex:1;display:flex;gap:26px;align-items:stretch;overflow:auto;padding:16px;min-height:0;}
  .bkt-match.bkt-current{border-color:var(--accent);box-shadow:0 0 0 2px rgba(74,158,255,.4);}
  .bkt-slot.bkt-won{border-style:solid;border-color:#3f7d4f;background:#1e2a1f;}
  #bracketArena{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow:auto;}
  .bkt-arena-cards{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;}
  .bkt-arena-cards .tt-card{width:100%;max-width:420px;}
  #bracketArena .tt-img{height:200px;}
  body.recording #bracketGenerate,body.recording #bracketRestart{display:none;}

  /* Setups menu overlay */
  #setupsOverlay{position:fixed;inset:0;z-index:380;display:none;align-items:center;justify-content:center;background:rgba(10,10,12,.7);}
  #setupsOverlay.show{display:flex;}
  #setupsPanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(92vw,560px);max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);}
  #setupsHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-size:16px;font-weight:700;}
  #setupsHead button{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:15px;}
  #setupsHead button:hover{color:#fff;}
  #setupsList{padding:12px 16px;overflow:auto;display:flex;flex-direction:column;gap:8px;}
  .setup-card{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  .setup-info{flex:1;min-width:0;}
  .setup-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .setup-mode{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:2px;}
  .setup-acts{display:flex;gap:6px;flex-shrink:0;}
  .setup-acts .tb{font-size:12px;padding:6px 10px;}

  /* Winner showcase overlay + fireworks */
  #winnerOverlay{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;background:rgba(10,10,12,.86);}
  #winnerOverlay.show{display:flex;}
  #fireworksCanvas{position:absolute;inset:0;width:100%;height:100%;}
  #winnerCard{
    position:relative;z-index:1;text-align:center;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:26px 34px;box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:min(90vw,460px);
  }
  .winner-label{color:#ffd740;font-weight:800;letter-spacing:3px;font-size:15px;margin-bottom:14px;}
  #winnerImg{max-width:100%;max-height:46vh;border-radius:10px;background:#fff;}
  #winnerName{font-size:26px;font-weight:800;margin-top:14px;color:#fff;word-break:break-word;}
  #winnerClose{margin-top:18px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;}
  #winnerClose:hover{filter:brightness(1.08);}

  /* ---- Draft (card grid) ---- */
  #draftArea{
    flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:10px;align-content:start;overflow:auto;padding:14px;
  }
  .draft-slot{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;}
  .draft-slot-head{display:flex;align-items:center;gap:4px;}
  .draft-slot-label{flex:1;min-width:0;}
  .draft-slot-label input{
    width:100%;background:transparent;border:none;color:var(--text);font-size:14px;font-weight:600;
    padding:4px 6px;border-radius:5px;
  }
  .draft-slot-label input:hover{background:var(--panel-2);}
  .draft-slot-label input:focus{outline:1px solid var(--accent);background:var(--panel-2);}
  .draft-slot-ctrl{display:flex;align-items:center;gap:2px;flex:0 0 auto;}
  .draft-slot-ctrl button{background:transparent;border:none;color:#cfcfcf;cursor:pointer;width:24px;height:24px;border-radius:5px;font-size:13px;}
  .draft-slot-ctrl button:hover{background:#2c2c2c;color:#fff;}
  .draft-drop{
    flex:1;min-height:150px;border:1px dashed #444;border-radius:8px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center;
  }
  .draft-drop.dragover{background:#2d3a4d;border-color:var(--accent);}
  .draft-drop .placeholder{color:#666;font-size:12px;}
  .draft-price{font-size:13px;font-weight:700;color:#7fff7f;}
  #draftAddSlot{
    grid-column:1/-1;justify-self:start;background:var(--panel);border:1px dashed var(--line);
    color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;
  }
  #draftAddSlot:hover{color:var(--text);border-color:#555;}
  .draft-slot.active-draft{border-color:var(--accent);box-shadow:0 0 0 2px rgba(74,158,255,.3);}

  /* Draft tabbed pool (one tab per slot) */
  #poolTabs{display:none;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
  .poolTab{
    background:var(--panel-2);color:var(--muted);border:1px solid var(--line);border-bottom:none;
    border-radius:7px 7px 0 0;padding:6px 12px;font-size:12px;cursor:pointer;
  }
  .poolTab:hover{color:var(--text);}
  .poolTab.active{background:var(--panel);color:#fff;font-weight:600;}
  .poolTab.dragover{background:#2d3a4d;border-color:var(--accent);color:#fff;}

  /* Larger vertical card thumbnail (used in draft slots) */
  .card-thumb{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:grab;user-select:none;width:100%;}
  .card-thumb img{max-width:100%;max-height:110px;object-fit:contain;border-radius:6px;background:#fff;pointer-events:none;}
  .card-thumb-name{font-size:12px;color:var(--text);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .card-thumb.dragging{opacity:.4;}
  .card-thumb.selected{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}

  /* ---- This / That ---- */
  #ttArena{
    flex:1;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;
    background:#202020;border:1px solid var(--line);border-radius:10px;padding:16px;min-height:220px;
  }
  .tt-card{flex:1 1 300px;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .tt-img{width:100%;height:260px;background:#151515;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .tt-img img{max-width:100%;max-height:100%;object-fit:contain;cursor:pointer;}
  .tt-name{font-size:16px;font-weight:700;color:var(--text);text-align:center;word-break:break-word;}
  .tt-pick{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;font-size:14px;font-weight:600;width:100%;}
  .tt-pick:hover{filter:brightness(1.08);}
  .tt-vs{font-size:22px;font-weight:800;color:var(--muted);flex:0 0 auto;}
  .tt-msg{color:var(--muted);font-size:15px;text-align:center;padding:40px;}
  .tt-champ-badge{font-size:12px;color:#7fff7f;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:4px;}

  /* Recording mode: hide setup/editing chrome for the new modes (gameplay stays) */
  body.recording .infoPanel .btnWide,
  body.recording #draftAddSlot,
  body.recording .draft-slot-ctrl{display:none;}
  body.recording .draft-slot-label input{pointer-events:none;}
</style>
</head>
<body>

<header id="appHeader">
<div id="modeBar">
  <div class="modeTabs" role="tablist" title="Switch game mode">
    <button class="modeTab active" data-mode="tier">Tier List</button>
    <button class="modeTab" data-mode="budget">Budget</button>
    <button class="modeTab" data-mode="bracket">Bracket</button>
    <button class="modeTab" data-mode="draft">Draft</button>
    <button class="modeTab" data-mode="thisthat">This / That</button>
  </div>
  <div class="spacer"></div>
  <div class="navActions">
    <button class="tb" id="exportBtn">🖼 Export PNG</button>
    <button class="tb" id="saveBtn">💾 Save</button>
    <button class="tb" id="loadBtn">📂 Load</button>
    <button class="tb" id="ghSaveBtn">☁ Save to GitHub</button>
    <button class="tb" id="setupsBtn">🗂 Setups</button>
    <button class="tb primary" id="recordBtn">● Recording Mode</button>
  </div>
</div>
<div id="toolbar">
  <h1>🏆</h1>
  <input id="titleInput" value="Untitled Tier List" spellcheck="false">
  <div class="tmpl">
    <select id="templateSelect" title="Load a template">
      <option value="" disabled selected>Templates</option>
    </select>
    <button class="tb" id="saveTemplateBtn" title="Save current rows as a reusable template">☆ Save as Template</button>
  </div>
  <label class="budgetSet">Budget $<input id="budgetInput" type="number" min="0" step="1" value="1000"></label>
  <label class="draftSet"><input type="checkbox" id="draftBudgetToggle"> Budget cap</label>
  <label class="draftSet" id="draftCapWrap">$<input type="number" id="draftBudgetInput" min="0" step="1" value="1000"></label>
  <div class="spacer"></div>
  <div class="sizeControl">Thumb
    <input type="range" id="thumbSize" min="56" max="140" value="88">
  </div>
  <button class="tb" id="uploadBtn">＋ Add Images</button>
  <button class="tb" id="resetBtn">Reset</button>
  <button class="tb active" id="previewToggle" title="Show/hide the preview panel">👁 Preview</button>
</div>
</header>

<div id="stage">
  <!-- Tier mode: the ranking board (flex-grows). Hidden in budget mode. -->
  <div id="col-board">
    <div id="board"></div>
    <div id="addTierWrap">
      <button id="addTierBtn">＋ Add Tier</button>
    </div>
  </div>

  <!-- Budget mode LEFT column: the receipt (its header is the list title). -->
  <div id="col-budgetInfo">
    <aside id="receiptPanel">
      <div id="receiptHead">Budget</div>
      <div id="receiptBody"></div>
    </aside>
  </div>

  <!-- Budget mode MIDDLE column: the purchase area (flex-grows). -->
  <div id="col-buy">
    <div id="buyArea"></div>
  </div>

  <!-- BRACKET mode: left = the chart; right = the current matchup (this/that). -->
  <div id="col-bracket">
    <aside class="infoPanel">
      <div class="infoHead bkt-head">
        <span id="bracketHead">Bracket</span>
        <span id="bracketChampBadge"></span>
        <span class="spacer"></span>
        <button class="tb" id="bracketGenerate">Generate from pool</button>
        <button class="tb" id="bracketRestart">↺ Restart</button>
      </div>
      <div id="bracketArea"></div>
    </aside>
  </div>
  <div id="col-bracketPlay">
    <aside class="infoPanel">
      <div class="infoHead" id="bracketArenaHead">Matchup</div>
      <div id="bracketArena"></div>
    </aside>
  </div>

  <!-- DRAFT mode: left = summary/cap; middle = positional slots. -->
  <div id="col-draftInfo">
    <aside class="infoPanel">
      <div class="infoHead" id="draftHead">Draft</div>
      <div class="infoBody" id="draftInfoBody"></div>
    </aside>
  </div>
  <div id="col-draft">
    <aside class="infoPanel">
      <div class="infoHead" id="draftMainHead">Draft</div>
      <div id="draftArea"></div>
    </aside>
  </div>

  <!-- THIS/THAT mode: left = champion + defeated; middle = A vs B. -->
  <div id="col-ttInfo">
    <aside class="infoPanel">
      <div class="infoHead" id="ttHead">This / That</div>
      <div class="infoBody" id="ttInfoBody"></div>
      <button class="btnWide secondary" id="ttReset">↺ Restart</button>
    </aside>
  </div>
  <div id="col-tt">
    <div id="ttArena"></div>
  </div>

  <!-- RIGHT column: preview (shared by all modes). -->
  <div id="rightCol">
    <aside id="previewPanel">
      <div id="previewHead">
        <span>Preview</span>
        <button id="previewClear" title="Clear preview">✕</button>
      </div>
      <div id="previewBox">
        <div id="previewEmpty">Click an image to preview it here</div>
        <img id="previewImg" alt="">
      </div>

</div>

<div id="poolSection">
  <div id="poolHeader">
    <h2>Image Pool</h2>
    <span class="hint">Drag images out to place them · drag back here to remove</span>
    <div class="spacer"></div>
    <button class="tb" id="uploadBtn2">＋ Add Images</button>
    <button class="tb" id="clearPoolBtn">Clear Pool</button>

</div>

<div id="recBar">
  <span id="recBarLabel">Recording mode — crop this bar out of your capture</span>

<div id="setupsOverlay">

    <div id="setupsHead"><span>Saved setups</span><button id="setupsClose">✕</button></div>
    <div id="setupsList"></div>

</div>

<div id="winnerOverlay">
  <canvas id="fireworksCanvas"></canvas>
  <div id="winnerCard">
    <div class="winner-label">🏆 CHAMPION</div>
    <img id="winnerImg" alt="">
    <div id="winnerName"></div>
    <button id="winnerClose">Close</button>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" multiple>
<input type="file" id="loadFileInput" accept="application/json,.json">

<script>
(function(){
  "use strict";

  // ---------- State ----------
  const DEFAULT_TIERS = [
    {name:"S", color:"#ff7f7f"},
    {name:"A", color:"#ffbf7f"},
    {name:"B", color:"#ffdf7f"},
    {name:"C", color:"#ffff7f"},
    {name:"D", color:"#bfff7f"},
  ];
  const PALETTE = ["#ff7f7f","#ffbf7f","#ffdf7f","#ffff7f","#bfff7f","#7fff7f","#7fffff","#7fbfff","#bf7fff","#ff7fff","#cccccc","#888888"];

  // Baked-in shared templates (ship with the app for every user).
  const PRESET_TEMPLATES = [
    {name:"Classic S–D", tiers:[
      {name:"S",color:"#ff7f7f"},{name:"A",color:"#ffbf7f"},{name:"B",color:"#ffdf7f"},
      {name:"C",color:"#ffff7f"},{name:"D",color:"#bfff7f"}]},
    {name:"Full S–F", tiers:[
      {name:"S",color:"#ff7f7f"},{name:"A",color:"#ffbf7f"},{name:"B",color:"#ffdf7f"},
      {name:"C",color:"#ffff7f"},{name:"D",color:"#bfff7f"},{name:"E",color:"#7fffff"},{name:"F",color:"#7fbfff"}]},
    {name:"10-Point Scale", tiers:[
      {name:"10",color:"#ff6b6b"},{name:"9",color:"#ff9f68"},{name:"8",color:"#ffbf7f"},
      {name:"7",color:"#ffdf7f"},{name:"6",color:"#ffff7f"},{name:"5",color:"#dfff7f"},
      {name:"4",color:"#bfff7f"},{name:"3",color:"#9fff9f"},{name:"2",color:"#7fffbf"},{name:"1",color:"#7fdfff"}]},
    {name:"Tier 1–5", tiers:[
      {name:"Tier 1",color:"#ff7f7f"},{name:"Tier 2",color:"#ffbf7f"},{name:"Tier 3",color:"#ffff7f"},
      {name:"Tier 4",color:"#bfff7f"},{name:"Tier 5",color:"#7fbfff"}]},
    {name:"Price $–$$$$ (4 tier)", tiers:[
      {name:"$$$$",color:"#ff7f7f"},{name:"$$$",color:"#ffbf7f"},
      {name:"$$",color:"#ffff7f"},{name:"$",color:"#bfff7f"}]},
    {name:"Price $–$$$ (3 tier)", tiers:[
      {name:"$$$",color:"#ff7f7f"},{name:"$$",color:"#ffff7f"},{name:"$",color:"#bfff7f"}]},
    {name:"Yes / Maybe / No", tiers:[
      {name:"Yes",color:"#7fff7f"},{name:"Maybe",color:"#ffff7f"},{name:"No",color:"#ff7f7f"}]},
    {name:"Pros / Neutral / Cons", tiers:[
      {name:"Pros",color:"#7fff7f"},{name:"Neutral",color:"#cccccc"},{name:"Cons",color:"#ff7f7f"}]},
    {name:"Blank (5 rows)", tiers:[
      {name:"",color:"#ff7f7f"},{name:"",color:"#ffbf7f"},{name:"",color:"#ffff7f"},
      {name:"",color:"#bfff7f"},{name:"",color:"#7fbfff"}]},
  ];
  const LS_KEY = "tiermaker_custom_templates_v1";

  const MODES = ["tier","budget","bracket","draft","thisthat"];
  let state = {
    title: "Untitled Tier List",
    mode: "tier",       // one of MODES
    budget: 1000,       // budget mode (and draft cap): starting budget
    tiers: [],          // {id,name,color,items:[itemId,...]}
    pool: [],           // itemId,...
    purchased: [],      // budget mode: itemIds bought
    bracket: {size:0, rounds:[], championId:null}, // rounds[r] = [[a,b],...]
    draft: {slots:[], budgetOn:false},             // slots: {id,label,itemId}
    thisThat: {championId:null, challengerId:null, defeated:[]},
    images: {},         // itemId -> {id, src, name, price}
  };
  let uid = 1;
  let selectedItemId = null;
  const nid = () => "i"+(uid++)+"_"+Math.random().toString(36).slice(2,7);

  // ---------- DOM refs ----------
  const board = document.getElementById("board");
  const pool = document.getElementById("pool");
  const buyArea = document.getElementById("buyArea");
  const titleInput = document.getElementById("titleInput");
  const fileInput = document.getElementById("fileInput");
  const loadFileInput = document.getElementById("loadFileInput");

  // ---------- Init ----------
  function init(){
    state.tiers = DEFAULT_TIERS.map(t=>({id:nid(),name:t.name,color:t.color,items:[]}));
    rebuildTemplateSelect();
    render();
  }

  // ---------- Rendering ----------
  function syncDocTitle(){
    const t = (state.title||"").trim();
    document.title = (t && t!=="Untitled Tier List") ? t+" — Tier Maker" : "Tier Maker";
  }

  function render(){
    normalizeState();
    titleInput.value = state.title;
    syncDocTitle();
    // drop a stale selection (e.g. after Load or Reset)
    if(selectedItemId && !state.images[selectedItemId]) selectedItemId = null;
    applyModeClass();
    refresh();
    renderPreview();
    updateHeaderOffset();
  }

  // Keep sticky columns tucked just below the (variable-height) header.
  function updateHeaderOffset(){
    const hdr = document.getElementById("appHeader");
    if(!hdr) return;
    document.documentElement.style.setProperty("--sticky-top", (hdr.offsetHeight + 8) + "px");
  }

  // Re-render everything that depends on where items live (used after drags,
  // price edits, buys). Cheaper than render(): doesn't touch the title field.
  function refresh(){
    renderBoard();
    renderBuyArea();
    renderPool();
    renderReceipt();
    renderBracket();
    renderBracketArena();
    renderDraft();
    renderThisThat();
  }

  function defaultDraftSlots(){
    return ["Engine","Forced Induction","Suspension","Wheels & Tyres","Brakes","Tuning"]
      .map(l=>({id:nid(), label:l, itemId:null}));
  }

  // Fill in fields that may be missing (older saved files, fresh images).
  function normalizeState(){
    if(!MODES.includes(state.mode)) state.mode = "tier";
    if(typeof state.budget!=="number" || isNaN(state.budget)) state.budget = 1000;
    if(!Array.isArray(state.purchased)) state.purchased = [];
    if(!state.bracket || typeof state.bracket!=="object") state.bracket = {size:0, rounds:[], championId:null};
    if(!Array.isArray(state.bracket.rounds)) state.bracket.rounds = [];
    if(!state.thisThat || typeof state.thisThat!=="object") state.thisThat = {championId:null, challengerId:null, defeated:[]};
    if(!Array.isArray(state.thisThat.defeated)) state.thisThat.defeated = [];
    if(!state.draft || typeof state.draft!=="object") state.draft = {slots:[], budgetOn:false};
    if(!Array.isArray(state.draft.slots) || state.draft.slots.length===0) state.draft.slots = defaultDraftSlots();
    // active pool tab must be a real slot (or the "unsorted" bucket)
    if(state.draft.activeSlotId!=="__unsorted" && !state.draft.slots.some(s=>s.id===state.draft.activeSlotId)){
      state.draft.activeSlotId = state.draft.slots[0] ? state.draft.slots[0].id : "__unsorted";
    }
    Object.values(state.images).forEach(im=>{ if(!("price" in im)) im.price = null; });
  }

  function titleOr(def){
    return (state.title && state.title!=="Untitled Tier List") ? state.title : def;
  }

  function fmtMoney(n){
    const neg = n < 0;
    return (neg?"-$":"$") + Math.abs(Math.round(n)).toLocaleString("en-US");
  }

  function applyModeClass(){
    const m = state.mode;
    MODES.forEach(x=>document.body.classList.toggle("mode-"+x, m===x));
    document.body.classList.toggle("draft-cap", m==="draft" && !!state.draft.budgetOn);
    document.querySelectorAll(".modeTab").forEach(b=>b.classList.toggle("active", b.dataset.mode===m));
    const bi = document.getElementById("budgetInput"); if(bi) bi.value = state.budget;
    const dc = document.getElementById("draftBudgetInput"); if(dc) dc.value = state.budget;
    const dt = document.getElementById("draftBudgetToggle"); if(dt) dt.checked = !!state.draft.budgetOn;
  }

  function setMode(m){
    state.mode = m;
    render();
  }

  function renderBoard(){
    board.innerHTML = "";
    state.tiers.forEach((tier, idx)=>{
      const row = document.createElement("div");
      row.className = "tier";
      row.dataset.tierId = tier.id;

      // label
      const label = document.createElement("div");
      label.className = "tier-label";
      label.style.background = tier.color;
      const ta = document.createElement("textarea");
      ta.value = tier.name;
      ta.rows = 1;
      ta.spellcheck = false;
      autoGrow(ta);
      ta.addEventListener("input", ()=>{ tier.name = ta.value; autoGrow(ta); });
      label.appendChild(ta);
      row.appendChild(label);

      // drop row
      const dz = document.createElement("div");
      dz.className = "tier-row";
      dz.dataset.tierId = tier.id;
      tier.items.forEach(itemId=>{
        const el = makeItemEl(itemId);
        if(el) dz.appendChild(el);
      });
      attachRowDnD(dz, tier);
      row.appendChild(dz);

      // controls
      const ctrl = document.createElement("div");
      ctrl.className = "tier-controls";
      const colorInput = document.createElement("input");
      colorInput.type = "color";
      colorInput.value = toHex(tier.color);
      colorInput.title = "Row color";
      colorInput.addEventListener("input", ()=>{ tier.color = colorInput.value; label.style.background = colorInput.value; });

      const r1 = document.createElement("div"); r1.className="ctrl-row";
      const up = iconBtn("▲","Move up",()=>moveTier(idx,-1));
      const down = iconBtn("▼","Move down",()=>moveTier(idx,1));
      r1.append(up,down);

      const r2 = document.createElement("div"); r2.className="ctrl-row";
      const add = iconBtn("＋","Add tier below",()=>addTier(idx+1));
      const del = iconBtn("🗑","Delete tier",()=>deleteTier(idx));
      r2.append(add,del);

      ctrl.append(colorInput, r1, r2);
      row.appendChild(ctrl);

      board.appendChild(row);
      autoGrow(ta); // recompute once in the DOM so multi-line labels size correctly
    });
  }

  function renderPool(){
    const draft = state.mode==="draft";
    const tabsEl = document.getElementById("poolTabs");
    if(draft){ tabsEl.style.display = "flex"; renderPoolTabs(); }
    else tabsEl.style.display = "none";

    pool.innerHTML = "";
    let ids = state.pool;
    if(draft) ids = state.pool.filter(id=>draftGroupOf(id)===state.draft.activeSlotId);

    if(ids.length === 0){
      const empty = document.createElement("div");
      empty.id = "poolEmpty";
      empty.textContent = draft
        ? "No images in this pool yet — with this tab active, click “Add Images”."
        : "No images yet — click “Add Images” to upload a pool of images to rank.";
      pool.appendChild(empty);
    } else {
      ids.forEach(itemId=>{
        const el = makeItemEl(itemId);
        if(el) pool.appendChild(el);
      });
    }
  }
  // Which draft tab a pooled image belongs to (falls back to the "unsorted" bucket).
  function draftGroupOf(id){
    const g = state.images[id] && state.images[id].group;
    if(g && state.draft.slots.some(s=>s.id===g)) return g;
    return "__unsorted";
  }
  function renderPoolTabs(){
    const el = document.getElementById("poolTabs");
    el.innerHTML = "";
    const active = state.draft.activeSlotId;
    const makeTab = (id, label)=>{
      const t = document.createElement("button");
      t.className = "poolTab" + (id===active ? " active" : "");
      const count = state.pool.filter(x=>draftGroupOf(x)===id).length;
      t.textContent = label + (count ? " (" + count + ")" : "");
      t.addEventListener("click", ()=>setActiveDraftSlot(id));
      attachDropZone(t, (dropId)=>setImageGroup(dropId, id==="__unsorted" ? null : id));
      return t;
    };
    state.draft.slots.forEach(s=> el.appendChild(makeTab(s.id, s.label || "Slot")));
    if(state.pool.some(x=>draftGroupOf(x)==="__unsorted")) el.appendChild(makeTab("__unsorted", "Unsorted"));
  }
  function setActiveDraftSlot(id){ state.draft.activeSlotId = id; refresh(); }
  function setImageGroup(id, group){
    if(!state.images[id]) return;
    removeItemEverywhere(id);          // pull out of pool / any slot
    state.images[id].group = group;    // null = unsorted
    state.pool.push(id);
    refresh();
  }

  function makeItemEl(itemId){
    const img = state.images[itemId];
    if(!img) return null;
    const el = document.createElement("div");
    el.className = "item" + (itemId===selectedItemId ? " selected" : "");
    el.draggable = true;
    el.dataset.itemId = itemId;
    // Click to preview. Native drag never fires click, so dragging is unaffected.
    el.addEventListener("click", ()=>selectItem(itemId));
    el.title = img.name || "";
    const im = document.createElement("img");
    im.src = img.src;
    im.alt = img.name || "";
    el.appendChild(im);
    if(img.name){
      const cap = document.createElement("div");
      cap.className = "cap";
      cap.textContent = img.name;
      el.appendChild(cap);
    }
    const del = document.createElement("div");
    del.className = "del";
    del.textContent = "×";
    del.title = "Delete image";
    del.addEventListener("click", (e)=>{ e.stopPropagation(); deleteImage(itemId); });
    el.appendChild(del);

    // Price badge — visible only in budget mode (CSS). Click to edit inline.
    const price = document.createElement("div");
    price.className = "price" + (img.price==null ? " unset" : "");
    price.textContent = img.price==null ? "$—" : fmtMoney(img.price);
    price.title = "Click to set price";
    price.addEventListener("click", (e)=>{
      e.stopPropagation();
      if(document.body.classList.contains("recording")) return;
      editPrice(itemId, price, el);
    });
    el.appendChild(price);

    attachItemDnD(el, itemId);
    return el;
  }

  // Swap the price badge for an input; commit on Enter/blur, cancel on Escape.
  function editPrice(itemId, badge, itemEl){
    const cur = state.images[itemId].price;
    const input = document.createElement("input");
    input.type = "number"; input.min = "0"; input.step = "1";
    input.className = "price-input";
    input.value = cur==null ? "" : cur;
    badge.replaceWith(input);
    itemEl.draggable = false;              // stop drags starting from the field
    input.focus(); input.select();
    let done = false;
    const commit = ()=>{
      if(done) return; done = true;
      const v = input.value.trim();
      const num = parseFloat(v);
      state.images[itemId].price = (v==="" || isNaN(num)) ? null : Math.max(0, Math.round(num));
      itemEl.draggable = true;
      refresh();          // rebuilds the thumbnail + updates budget/receipt
      renderPreview();
    };
    input.addEventListener("click", (e)=>e.stopPropagation());
    input.addEventListener("keydown", (e)=>{
      if(e.key==="Enter"){ e.preventDefault(); input.blur(); }
      else if(e.key==="Escape"){ done = true; itemEl.draggable = true; refresh(); }
    });
    input.addEventListener("blur", commit);
  }

  // A compact horizontal chip (thumb + name) for bracket/draft slots.
  // Draggable and click-to-preview, just like a pool item.
  function makeChip(itemId){
    const img = state.images[itemId];
    if(!img) return null;
    const c = document.createElement("div");
    c.className = "chip" + (itemId===selectedItemId ? " selected" : "");
    c.draggable = true;
    c.dataset.itemId = itemId;
    c.title = img.name || "";
    c.addEventListener("click", ()=>selectItem(itemId));
    const im = document.createElement("img");
    im.src = img.src; im.alt = img.name || "";
    c.appendChild(im);
    const nm = document.createElement("span");

  // A larger vertical card thumbnail (draft slots): big image + name below.
  function makeCardThumb(itemId){
    const img = state.images[itemId];
    if(!img) return null;
    const el = document.createElement("div");
    el.className = "card-thumb" + (itemId===selectedItemId ? " selected" : "");

  // ---------- Item helpers ----------
  function iconBtn(txt,title,fn){
    const b=document.createElement("button");
    b.textContent=txt;b.title=title;b.addEventListener("click",fn);return b;
  }
  function autoGrow(ta){ ta.style.height="auto"; ta.style.height=Math.max(24,ta.scrollHeight)+"px"; }
  function toHex(c){
    if(/^#[0-9a-f]{6}$/i.test(c)) return c;
    // named / rgb -> canvas convert
    const ctx=document.createElement("canvas").getContext("2d");
    ctx.fillStyle=c; return ctx.fillStyle;
  }

  // ---------- Drag & Drop ----------
  let dragItemId = null;

  function attachItemDnD(el, itemId){
    el.addEventListener("dragstart", (e)=>{
      dragItemId = itemId;
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", itemId);
    });
    el.addEventListener("dragend", ()=>{
      el.classList.remove("dragging");
      dragItemId = null;
      clearDragStyles();
    });
  }

  function attachRowDnD(dz, tier){
    dz.addEventListener("dragover", (e)=>{
      e.preventDefault();
      e.dataTransfer.dropEffect="move";
      dz.classList.add("dragover");
    });
    dz.addEventListener("dragleave", (e)=>{
      if(!dz.contains(e.relatedTarget)) dz.classList.remove("dragover");
    });
    dz.addEventListener("drop", (e)=>{
      e.preventDefault();
      dz.classList.remove("dragover");
      const itemId = dragItemId || e.dataTransfer.getData("text/plain");
      if(!itemId) return;
      const beforeId = getDropTargetId(dz, e.clientX, e.clientY);
      moveItemTo(itemId, {type:"tier", tierId:tier.id}, beforeId);
    });
  }

  // pool as a drop zone
  pool.addEventListener("dragover",(e)=>{ e.preventDefault(); e.dataTransfer.dropEffect="move"; pool.classList.add("dragover"); });
  pool.addEventListener("dragleave",(e)=>{ if(!pool.contains(e.relatedTarget)) pool.classList.remove("dragover"); });
  pool.addEventListener("drop",(e)=>{
    e.preventDefault();
    pool.classList.remove("dragover");
    const itemId = dragItemId || e.dataTransfer.getData("text/plain");
    if(!itemId) return;
    const beforeId = getDropTargetId(pool, e.clientX, e.clientY);
    moveItemTo(itemId, {type:"pool"}, beforeId);
  });

  // buy area (budget mode) as a drop zone
  buyArea.addEventListener("dragover",(e)=>{ e.preventDefault(); e.dataTransfer.dropEffect="move"; buyArea.classList.add("dragover"); });
  buyArea.addEventListener("dragleave",(e)=>{ if(!buyArea.contains(e.relatedTarget)) buyArea.classList.remove("dragover"); });
  buyArea.addEventListener("drop",(e)=>{
    e.preventDefault();
    buyArea.classList.remove("dragover");
    const itemId = dragItemId || e.dataTransfer.getData("text/plain");
    if(!itemId) return;
    const beforeId = getDropTargetId(buyArea, e.clientX, e.clientY);
    moveItemTo(itemId, {type:"buy"}, beforeId);
  });

  function getDropTargetId(container, x, y){
    const els = [...container.querySelectorAll(".item")].filter(el=>el.dataset.itemId!==dragItemId);
    for(const el of els){
      const r = el.getBoundingClientRect();
      if(y < r.top + r.height && x < r.left + r.width/2 && y >= r.top){
        return el.dataset.itemId;
      }
    }
    // fallback: first item whose center is below the cursor row
    for(const el of els){
      const r=el.getBoundingClientRect();
      if(y < r.top + r.height/2) return el.dataset.itemId;
    }
    return null;
  }

  function clearDragStyles(){
    document.querySelectorAll(".dragover").forEach(el=>el.classList.remove("dragover"));
  }

  // "Move zones" hold an item in exactly one place: pool, tiers, purchased, draft slots.
  // (Bracket and This/That are reference zones and are NOT cleared here.)
  function removeItemEverywhere(itemId){
    state.pool = state.pool.filter(id=>id!==itemId);
    state.purchased = state.purchased.filter(id=>id!==itemId);
    state.tiers.forEach(t=>{ t.items = t.items.filter(id=>id!==itemId); });
    if(state.draft && state.draft.slots) state.draft.slots.forEach(s=>{ if(s.itemId===itemId) s.itemId=null; });
  }

  // Clear an image out of the reference zones (bracket + This/That). Used on delete.
  function purgeImageRefs(itemId){
    if(state.bracket && state.bracket.rounds){
      state.bracket.rounds.forEach(rd=>rd.forEach(m=>{ if(m[0]===itemId) m[0]=null; if(m[1]===itemId) m[1]=null; }));
      if(state.bracket.championId===itemId) state.bracket.championId=null;
    }
    const tt = state.thisThat;
    if(tt){
      if(tt.championId===itemId) tt.championId=null;
      if(tt.challengerId===itemId) tt.challengerId=null;
      tt.defeated = (tt.defeated||[]).filter(id=>id!==itemId);
    }
  }

  function moveItemTo(itemId, dest, beforeId){
    removeItemEverywhere(itemId);
    let arr;
    if(dest.type==="pool") arr = state.pool;
    else if(dest.type==="buy") arr = state.purchased;
    else arr = state.tiers.find(t=>t.id===dest.tierId).items;
    if(beforeId && beforeId!==itemId){
      const i = arr.indexOf(beforeId);
      if(i>=0){ arr.splice(i,0,itemId); }
      else arr.push(itemId);
    } else {
      arr.push(itemId);
    }
    refresh();
  }

  // ---------- Tier actions ----------
  function moveTier(idx, dir){
    const j = idx+dir;
    if(j<0||j>=state.tiers.length) return;
    const [t] = state.tiers.splice(idx,1);
    state.tiers.splice(j,0,t);
    renderBoard();
  }
  function addTier(at){
    const color = PALETTE[state.tiers.length % PALETTE.length];
    const t = {id:nid(), name:"New", color, items:[]};
    if(typeof at==="number") state.tiers.splice(at,0,t);
    else state.tiers.push(t);
    renderBoard();
  }
  function deleteTier(idx){
    const t = state.tiers[idx];
    if(t.items.length){ // move its items back to pool
      state.pool.push(...t.items);
    }
    state.tiers.splice(idx,1);
    if(state.tiers.length===0) state.tiers.push({id:nid(),name:"New",color:PALETTE[0],items:[]});
    renderBoard();
    renderPool();
  }

  // ---------- Images ----------
  function addImages(files){
    const list = [...files].filter(f=>f.type.startsWith("image/"));
    let pending = list.length;
    if(!pending) return;
    list.forEach(file=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const id = nid();
        const name = file.name.replace(/\.[^.]+$/,"");
        const rec = {id, src:reader.result, name, price:null};
        // In draft mode, new uploads join the active tab's pool.
        if(state.mode==="draft" && state.draft.activeSlotId && state.draft.activeSlotId!=="__unsorted"){
          rec.group = state.draft.activeSlotId;
        }
        state.images[id] = rec;
        state.pool.push(id);
        pending--;
        if(pending===0) refresh(); // update the active mode too (e.g. auto-start This/That)
      };
      reader.readAsDataURL(file);
    });
  }
  function deleteImage(itemId){
    removeItemEverywhere(itemId);
    purgeImageRefs(itemId);
    delete state.images[itemId];
    if(selectedItemId===itemId) selectedItemId = null;
    refresh();
    renderPreview();
  }

  // ---------- Budget mode rendering ----------
  function budgetSpent(){
    return state.purchased.reduce((s,id)=>{
      const im = state.images[id];
      return s + ((im && im.price) || 0);
    }, 0);
  }

  function renderBuyArea(){
    buyArea.innerHTML = "";
    if(state.purchased.length === 0){
      const e = document.createElement("div");
      e.id = "buyEmpty";
      e.textContent = "Drag items here to buy them";
      buyArea.appendChild(e);
    } else {
      state.purchased.forEach(id=>{
        const el = makeItemEl(id);
        if(el) buyArea.appendChild(el);
      });
    }
  }

  function renderReceipt(){
    // Header doubles as the list title.
    document.getElementById("receiptHead").textContent =
      (state.title && state.title!=="Untitled Tier List") ? state.title : "Budget";

    const body = document.getElementById("receiptBody");
    body.innerHTML = "";

    // Itemised purchases first.
    if(state.purchased.length === 0){
      const e = document.createElement("div");
      e.id = "receiptEmpty";
      e.textContent = "No items purchased yet";
      body.appendChild(e);
    } else {
      state.purchased.forEach(id=>{
        const im = state.images[id];
        if(!im) return;
        const amt = im.price==null ? "—" : "-"+fmtMoney(im.price);
        body.appendChild(rcRow(im.name || "Item", amt));
      });
    }

    // Budget then Remaining, pinned to the bottom edge (remaining = budget − items).
    const totals = document.createElement("div");
    totals.className = "rc-totals";
    totals.appendChild(rcHr());
    totals.appendChild(rcRow("Budget", fmtMoney(state.budget), "rc-budget"));
    const remaining = state.budget - budgetSpent();
    const rem = rcRow("Remaining", fmtMoney(remaining), "rc-remaining");
    if(remaining < 0) rem.classList.add("neg");
    totals.appendChild(rem);
    body.appendChild(totals);
  }
  function rcRow(name, amt, cls){
    const r = document.createElement("div"); r.className = "rc-row" + (cls ? " "+cls : "");
    const n = document.createElement("span"); n.className = "rc-name"; n.textContent = name;
    const d = document.createElement("span"); d.className = "rc-dots";
    const a = document.createElement("span"); a.className = "rc-amt"; a.textContent = amt;
    r.append(n, d, a);
    return r;
  }
  function rcHr(){ const h = document.createElement("div"); h.className = "rc-hr"; return h; }

  // ---------- Bracket mode ----------
  function bracketRoundName(matches){
    if(matches===1) return "Final";
    if(matches===2) return "Semifinals";
    if(matches===4) return "Quarterfinals";
    return "Round of " + (matches*2);
  }
  function generateBracketFromPool(){
    const n = state.pool.length;
    if(n < 2){ flash("Add at least 2 images to the pool first."); return; }
    if(n > 32){ flash("Brackets support up to 32 images — remove " + (n-32) + " from the pool."); return; }
    // A clean single-elimination bracket needs a power-of-two count (2/4/8/16/32).
    if((n & (n-1)) !== 0){
      let lo = 1; while(lo*2 <= n) lo *= 2;   // nearest power of two below
      const hi = lo*2;
      flash("A bracket needs 2, 4, 8, 16 or 32 images. You have " + n +
            " — remove " + (n-lo) + " for a " + lo + "-slot bracket, or add " + (hi-n) + " for a " + hi + "-slot one.");
      return;
    }
    const ids = state.pool.slice();
    const size = n;
    const M = size/2;
    const r0 = [];
    for(let k=0;k<M;k++) r0.push([ids[2*k], ids[2*k+1]]); // adjacent pool items face off
    const rounds = [r0];
    let matches = M/2;
    while(matches >= 1){ rounds.push(Array.from({length:matches}, ()=>[null,null])); matches/=2; }
    state.bracket = {size, rounds, championId:null};
    refresh();
    flash("Bracket built — " + size + " entrants.");
  }
  // Kept for older saved brackets that may contain byes; full brackets never trigger it.
  function autoAdvanceByes(){
    if(state.bracket.rounds.length < 2) return;
    state.bracket.rounds[0].forEach((m,j)=>{
      const present = [m[0],m[1]].filter(Boolean);
      if(present.length===1) state.bracket.rounds[1][Math.floor(j/2)][j%2] = present[0];
    });
  }
  // The chart is now a read-only scoreboard; picks happen in the matchup arena.
  function renderBracket(){
    document.getElementById("bracketHead").textContent = titleOr("Bracket");
    const badge = document.getElementById("bracketChampBadge");
    if(state.bracket.championId && state.images[state.bracket.championId]){
      badge.style.display = ""; badge.textContent = "🏆 " + (state.images[state.bracket.championId].name || "Champion");
    } else badge.style.display = "none";

    const area = document.getElementById("bracketArea");
    area.innerHTML = "";
    if(!state.bracket.rounds.length){
      const e = document.createElement("div"); e.id = "bracketEmpty";
      e.textContent = "No bracket yet. Add 2, 4, 8, 16 or 32 images to the pool, then click “Generate from pool”.";
      area.appendChild(e);
      return;
    }
    const rounds = state.bracket.rounds;
    const cur = bracketCurrentMatch();
    rounds.forEach((matchesArr, r)=>{
      const col = document.createElement("div"); col.className = "bkt-round";
      const head = document.createElement("div"); head.className = "bkt-round-head";
      head.textContent = bracketRoundName(matchesArr.length);
      col.appendChild(head);
      const body = document.createElement("div"); body.className = "bkt-round-body";
      matchesArr.forEach((match, mi)=>{
        const wrap = document.createElement("div"); wrap.className = "bkt-match-wrap";
        const card = document.createElement("div"); card.className = "bkt-match";
        if(cur && cur.r===r && cur.mi===mi) card.classList.add("bkt-current");
        const winnerId = r < rounds.length-1 ? rounds[r+1][Math.floor(mi/2)][mi%2] : state.bracket.championId;
        [0,1].forEach(ab=>{
          const slot = document.createElement("div"); slot.className = "bkt-slot";
          const id = match[ab];
          if(id && state.images[id]){
            slot.appendChild(makeChip(id));
            if(id===winnerId) slot.classList.add("bkt-won");
          } else {
            const ph = document.createElement("div"); ph.className = "placeholder"; ph.textContent = r===0 ? "Seed" : "Winner"; slot.appendChild(ph);
          }
          card.appendChild(slot);
        });
        wrap.appendChild(card); body.appendChild(wrap);
      });
      col.appendChild(body); area.appendChild(col);
    });
  }

  // First match (in play order) with both competitors present but no winner recorded.
  function bracketCurrentMatch(){
    const rounds = state.bracket.rounds;
    for(let r=0;r<rounds.length;r++){
      for(let mi=0;mi<rounds[r].length;mi++){
        const m = rounds[r][mi];
        if(m[0] && m[1] && state.images[m[0]] && state.images[m[1]]){
          const decided = r < rounds.length-1 ? !!rounds[r+1][Math.floor(mi/2)][mi%2] : !!state.bracket.championId;
          if(!decided) return {r, mi};
        }
      }
    }
    return null;
  }

  // Right-hand "this / that" arena for the current matchup.
  function renderBracketArena(){
    const arena = document.getElementById("bracketArena");
    const head = document.getElementById("bracketArenaHead");
    arena.innerHTML = "";
    if(!state.bracket.rounds.length){
      head.textContent = "Matchup";
      const m = document.createElement("div"); m.className = "tt-msg";
      m.textContent = "Generate a bracket to start the matchups."; arena.appendChild(m); return;
    }
    const cur = bracketCurrentMatch();
    if(!cur){
      if(state.bracket.championId && state.images[state.bracket.championId]){
        head.textContent = "Champion";
        const wrap = document.createElement("div"); wrap.className = "tt-card";
        wrap.appendChild(ttImg(state.bracket.championId));
        const nm = document.createElement("div"); nm.className = "tt-name"; nm.textContent = state.images[state.bracket.championId].name || "Champion"; wrap.appendChild(nm);
        const wl = document.createElement("div"); wl.className = "tt-champ-badge"; wl.textContent = "🏆 Champion"; wrap.appendChild(wl);
        const rb = document.createElement("button"); rb.className = "tt-pick"; rb.textContent = "Show celebration 🎆";
        rb.addEventListener("click", ()=>showWinner(state.bracket.championId)); wrap.appendChild(rb);
        arena.appendChild(wrap);
      } else {
        head.textContent = "Matchup";
        const m = document.createElement("div"); m.className = "tt-msg"; m.textContent = "All matchups decided."; arena.appendChild(m);
      }
      return;
    }
    head.textContent = bracketRoundName(state.bracket.rounds[cur.r].length);
    const stack = document.createElement("div"); stack.className = "bkt-arena-cards";
    stack.appendChild(bracketCard(cur.r, cur.mi, 0));
    const vs = document.createElement("div"); vs.className = "tt-vs"; vs.textContent = "VS"; stack.appendChild(vs);
    stack.appendChild(bracketCard(cur.r, cur.mi, 1));
    arena.appendChild(stack);
  }
  function bracketCard(r, mi, ab){
    const id = state.bracket.rounds[r][mi][ab];
    const card = document.createElement("div"); card.className = "tt-card";
    card.appendChild(ttImg(id));

    const btn = document.createElement("button"); btn.className = "tt-pick"; btn.textContent = "Pick this";
    btn.addEventListener("click", ()=>pickBracketWinner(r, mi, ab));

    return card;
  }
  function pickBracketWinner(r, mi, ab){
    const rounds = state.bracket.rounds;
    const winner = rounds[r][mi][ab];
    if(!winner) return;
    if(r < rounds.length-1){ rounds[r+1][Math.floor(mi/2)][mi%2] = winner; }
    else { state.bracket.championId = winner; }
    refresh();
    if(r === rounds.length-1) showWinner(winner); // final decided
  }
  function bracketRestart(){
    if(!state.bracket.rounds.length) return;
    for(let r=1;r<state.bracket.rounds.length;r++) state.bracket.rounds[r] = state.bracket.rounds[r].map(()=>[null,null]);
    state.bracket.championId = null;
    refresh();
  }

  // Generic reference-drop helper: calls onDrop(itemId) without moving the item.
  function attachDropZone(el, onDrop){
    el.addEventListener("dragover",(e)=>{ e.preventDefault(); e.dataTransfer.dropEffect="move"; el.classList.add("dragover"); });
    el.addEventListener("dragleave",(e)=>{ if(!el.contains(e.relatedTarget)) el.classList.remove("dragover"); });
    el.addEventListener("drop",(e)=>{
      e.preventDefault(); el.classList.remove("dragover");
      const id = dragItemId || e.dataTransfer.getData("text/plain");
      if(id) onDrop(id);
    });
  }

  // ---------- Draft mode ----------
  function draftTotals(){
    const spent = state.draft.slots.reduce((s,sl)=>{
      const im = sl.itemId && state.images[sl.itemId];
      return s + ((im && im.price) || 0);
    }, 0);
    return {spent, remaining: state.budget - spent};
  }

    document.getElementById("draftMainHead").textContent = titleOr("Draft");

      // Clicking anywhere on the card makes its pool tab active.
      cardEl.addEventListener("click", ()=>setActiveDraftSlot(slot.id));

      ctrl.appendChild(iconBtn("▲","Move up",()=>moveDraftSlot(idx,-1)));
      ctrl.appendChild(iconBtn("▼","Move down",()=>moveDraftSlot(idx,1)));
      ctrl.appendChild(iconBtn("🗑","Remove slot",()=>removeDraftSlot(idx)));
      head.append(lab, ctrl);

      const drop = document.createElement("div"); drop.className = "draft-drop";

    });

    const add = document.createElement("button"); add.id = "draftAddSlot"; add.textContent = "＋ Add slot";
    add.addEventListener("click", ()=>{ state.draft.slots.push({id:nid(), label:"New slot", itemId:null}); refresh(); });
    area.appendChild(add);
  }
  function draftAssign(slotId, itemId){
    const slot = state.draft.slots.find(s=>s.id===slotId);
    if(!slot) return;
    const prev = slot.itemId;
    removeItemEverywhere(itemId);                 // leaves pool / any other slot
    if(prev && prev!==itemId) state.pool.push(prev); // displaced pick returns to pool
    slot.itemId = itemId;
    refresh();
  }
  function moveDraftSlot(idx, dir){
    const j = idx+dir; if(j<0||j>=state.draft.slots.length) return;
    const [s] = state.draft.slots.splice(idx,1);
    state.draft.slots.splice(j,0,s);
    refresh();
  }
  function removeDraftSlot(idx){
    const s = state.draft.slots[idx];
    if(s.itemId) state.pool.push(s.itemId);
    state.draft.slots.splice(idx,1);
    if(state.draft.slots.length===0) state.draft.slots.push({id:nid(), label:"Slot", itemId:null});
    // if the removed slot's tab was active, fall back to the first slot
    if(state.draft.activeSlotId===s.id) state.draft.activeSlotId = state.draft.slots[0].id;
    refresh();
  }

  // ---------- This / That mode ----------
  function ttEnsure(){
    const tt = state.thisThat;
    if(tt.championId && !state.images[tt.championId]) tt.championId = null;
    if(tt.challengerId && !state.images[tt.challengerId]) tt.challengerId = null;
    tt.defeated = (tt.defeated||[]).filter(id=>state.images[id]);
    const used = new Set(tt.defeated);
    if(tt.championId) used.add(tt.championId);
    if(tt.challengerId) used.add(tt.challengerId);
    if(!tt.championId){ const n = state.pool.find(id=>!used.has(id)); if(n){ tt.championId=n; used.add(n); } }
    if(!tt.challengerId){ const n = state.pool.find(id=>!used.has(id)); if(n){ tt.challengerId=n; used.add(n); } }
  }
  function renderThisThat(){

    const tt = state.thisThat;
    document.getElementById("ttHead").textContent = titleOr("This / That");

  function pickThisThat(side){
    const tt = state.thisThat; const a = tt.championId, b = tt.challengerId;
    if(!a || !b) return;
    const winner = side==="a" ? a : b;
    const loser = side==="a" ? b : a;
    if(loser) tt.defeated.push(loser);
    tt.championId = winner;
    tt.challengerId = null;   // ttEnsure loads the next challenger
    refresh();
    // No challenger left and at least one beaten → this champion won it all.
    if(!state.thisThat.challengerId && state.thisThat.defeated.length>0) showWinner(state.thisThat.championId);
  }

  // ---------- Winner showcase (fireworks) ----------
  let fwRAF = null, fwResize = null;
  function showWinner(id){
    const im = state.images[id];
    if(!im) return;
    document.getElementById("winnerImg").src = im.src;

  function startFireworks(){
    const cv = document.getElementById("fireworksCanvas");
    const ctx = cv.getContext("2d");
    const resize = ()=>{ cv.width = window.innerWidth; cv.height = window.innerHeight; };
    resize();
    if(fwResize) window.removeEventListener("resize", fwResize);
    fwResize = resize; window.addEventListener("resize", resize);
    const colors = ["#ff5252","#ffd740","#69f0ae","#40c4ff","#e040fb","#ffffff"];
    let parts = [], last = 0, launch = 0;
    function burst(x,y){
      const c = colors[Math.floor(Math.random()*colors.length)];
      const n = 40 + Math.floor(Math.random()*30);
      for(let i=0;i<n;i++){ const a = (Math.PI*2*i)/n, sp = 1 + Math.random()*3.5;
        parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color:c}); }
    }
    function frame(t){
      if(!last) last = t;
      const dt = Math.min(3, (t-last)/16.67); last = t;
      launch -= dt;
      if(launch <= 0){ burst(cv.width*(0.15+Math.random()*0.7), cv.height*(0.15+Math.random()*0.45)); launch = 16 + Math.random()*22; }
      ctx.clearRect(0,0,cv.width,cv.height);
      parts.forEach(p=>{ p.vy += 0.03*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= 0.012*dt;
        ctx.globalAlpha = Math.max(0,p.life); ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 6.2832); ctx.fill(); });
      ctx.globalAlpha = 1;
      parts = parts.filter(p=>p.life>0);
      fwRAF = requestAnimationFrame(frame);
    }
    if(fwRAF) cancelAnimationFrame(fwRAF);
    last = 0; parts = []; fwRAF = requestAnimationFrame(frame);
  }
  function stopFireworks(){
    if(fwRAF) cancelAnimationFrame(fwRAF); fwRAF = null;
    if(fwResize){ window.removeEventListener("resize", fwResize); fwResize = null; }
  }

  // Load a project straight from a URL param, e.g.
  //   ?project=spend-save-2026      -> fetches ./projects/spend-save-2026.json
  //   ?project=https://.../foo.json -> fetches that exact URL
  //   add &record=1 to open directly in recording mode
  function loadProjectFromURL(){
    const params = new URLSearchParams(location.search);
    const p = params.get("project");
    if(!p) return;
    const url = /^https?:\/\//i.test(p) ? p : ("projects/" + p.replace(/\.json$/i,"") + ".json");
    fetch(url)
      .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(obj=>{
        loadFromObj(obj);
        if(params.get("record")==="1"){ if(!document.body.classList.contains("recording")) toggleRecording(); }
      })
      .catch(err=>{
        flash("Couldn't open shared project: "+err.message);
      });
  }
